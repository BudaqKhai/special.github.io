<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: linear-gradient(pink, purple);
      color: white;
    }
    img {
      border-radius: 20px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      background: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Happy Birthday Sayang 🎂</h1>
  <p>Terima kasih sebab hadir dalam hidup aku ❤️</p>

  <img src="gambar.jpg" width="250">

  <br><br>

  <button onclick="showMessage()">Klik sini 😏</button>

  <p id="msg"></p>

  <audio autoplay loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showMessage() {
      document.getElementById("msg").innerHTML =
      "Aku sayang kau sampai bila-bila 💕";
    }
  </script>

</body>
</html>
