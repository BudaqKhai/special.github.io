<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  color: #fff;
}

.container {
  padding: 40px 20px;
}

h1 {
  font-size: 2.5em;
}

.typing {
  font-size: 1.2em;
  margin-top: 10px;
  min-height: 30px;
}

.gallery {
  margin-top: 30px;
}

.gallery img {
  width: 120px;
  margin: 10px;
  border-radius: 15px;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.1);
}

button {
  margin-top: 30px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #ff6b81;
  font-weight: bold;
  cursor: pointer;
}

#secret {
  margin-top: 20px;
  display: none;
  font-size: 1.2em;
}
</style>

</head>

<body>

<div class="container">

<h1>Happy Birthday Sayang 🎂</h1>

<div class="typing" id="typing"></div>

<div class="gallery">
  <img src="https://via.placeholder.com/120">
  <img src="https://via.placeholder.com/120">
  <img src="https://via.placeholder.com/120">
</div>

<button onclick="showSecret()">Klik sini 😏</button>

<div id="secret">
  Aku sayang kau sampai bila-bila 💕
</div>

</div>

<audio autoplay loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
const text = "Terima kasih sebab hadir dalam hidup aku ❤️";
let i = 0;

function typingEffect() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typingEffect, 50);
  }
}

typingEffect();

function showSecret() {
  document.getElementById("secret").style.display = "block";
}
</script>

</body>
</html>
